<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('zw_theme');
        var theme = stored ? stored : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
        document.addEventListener('DOMContentLoaded', function () {
          var m = document.getElementById('themeColorMeta');
          if (m) m.setAttribute('content', theme === 'light' ? '#ffffff' : '#0a0a0a');
        });
      } catch (_) {}
    })();
  </script>
  <title>Project Dashboard — Zohn Wheeler</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" id="themeColorMeta" content="#0a0a0a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #161616; --surface2: #1e1e1e;
      --border: #252525; --border2: #333; --accent: #00e5ff; --accent2: #7c3aed;
      --accent3: #f59e0b; --text: #ececec; --muted: #888; --muted2: #555;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --mono: 'JetBrains Mono', 'Fira Code', monospace;
      --radius: 14px; --radius-sm: 8px; --max: 780px;
    }
    :root[data-theme="light"] {
      --bg: #ffffff; --surface: #f5f5f7; --surface2: #ececef;
      --border: #e2e2e5; --border2: #cfcfd4; --accent: #0e7490; --accent2: #6d28d9;
      --accent3: #b45309; --text: #16181d; --muted: #5b5f68; --muted2: #8a8f99;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.65; }
    ::selection { background: var(--accent); color: #000; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { opacity: 0.8; }
    .bg-grid { position: fixed; inset: 0; z-index: -2; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 64px 64px; opacity: 0.18; }
    .glow { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: -1; }
    .glow-1 { width: 500px; height: 500px; background: rgba(0,229,255,0.05); top: -120px; right: -80px; }

    nav { position: sticky; top: 0; z-index: 100; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; background: rgba(10,10,10,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); }
    :root[data-theme="light"] nav { background: rgba(255,255,255,0.85); }
    .nav-logo { font-family: var(--mono); font-size: 1rem; color: var(--accent); font-weight: 600; }
    .nav-logo span { color: var(--muted); }
    .theme-toggle { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 8px; background: none; border: 1px solid var(--border); color: var(--muted); cursor: pointer; transition: 0.2s; flex-shrink: 0; }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .theme-toggle svg { width: 14px; height: 14px; }
    .theme-toggle .icon-sun { display: none; }
    :root[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    :root[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 3rem 2rem 6rem; }
    .skeleton { padding: 4rem 0; text-align: center; color: var(--muted); font-family: var(--mono); font-size: 0.85rem; }

    .eyebrow { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 2rem; }

    .stepper { display: flex; flex-wrap: wrap; gap: 0; margin-bottom: 2.5rem; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .step { flex: 1; min-width: 100px; padding: 0.85rem 0.5rem; text-align: center; background: var(--surface); border-right: 1px solid var(--border); font-family: var(--mono); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted2); position: relative; }
    .step:last-child { border-right: none; }
    .step.done { color: var(--text); background: var(--surface2); }
    .step.current { color: #000; background: var(--accent); }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
    .card h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.75rem; }
    .staging-link { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1.1rem; background: var(--accent); color: #000; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; }

    .updates-list { display: flex; flex-direction: column; gap: 1rem; }
    .update-item { padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
    .update-item:last-child { border-bottom: none; padding-bottom: 0; }
    .update-date { font-family: var(--mono); font-size: 0.68rem; color: var(--muted2); margin-bottom: 0.3rem; }
    .update-body { font-size: 0.9rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
    .updates-empty { color: var(--muted); font-size: 0.85rem; }

    .not-found { text-align: center; padding: 5rem 1.5rem; }
    .not-found h1 { margin-bottom: 0.75rem; }
    .not-found p { color: var(--muted); margin-bottom: 1.5rem; }
    .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.7rem 1.4rem; border-radius: var(--radius-sm); font-size: 0.85rem; font-weight: 600; background: var(--accent); color: #000; }

    footer { text-align: center; padding: 2rem; font-family: var(--mono); font-size: 0.7rem; color: var(--muted2); border-top: 1px solid var(--border); }
    @media (max-width: 560px) { .wrap { padding: 2rem 1.25rem 4rem; } .step { min-width: 33%; } }
  </style>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="glow glow-1" aria-hidden="true"></div>

  <nav>
    <a href="index.html" class="nav-logo">zohn<span>.dev</span></a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </nav>

  <main class="wrap" id="app">
    <div class="skeleton">Loading your project…</div>
  </main>

  <footer>
    Built by <a href="index.html">Zohn Wheeler</a>
  </footer>

  <script>
    const STAGES = [
      { key: 'discovery', label: 'Discovery' },
      { key: 'design', label: 'Design' },
      { key: 'build', label: 'Build' },
      { key: 'review', label: 'Review' },
      { key: 'launch', label: 'Launch' },
      { key: 'support', label: 'Support' },
    ];

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }

    function fmtDate(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function renderStepper(status) {
      const idx = STAGES.findIndex(s => s.key === status);
      return `<div class="stepper">${STAGES.map((s, i) => {
        const cls = i === idx ? 'current' : i < idx ? 'done' : '';
        return `<div class="step ${cls}">${esc(s.label)}</div>`;
      }).join('')}</div>`;
    }

    function renderNotFound() {
      document.getElementById('app').innerHTML = `
        <div class="not-found">
          <h1>Project not found</h1>
          <p>This link doesn't match an active project. If you think that's wrong, reach out and I'll sort it out.</p>
          <a href="mailto:zohnwheeler@gmail.com" class="btn">Email zohnwheeler@gmail.com</a>
        </div>`;
    }

    function renderProject(project, updates) {
      const updatesHtml = updates.length
        ? `<div class="updates-list">${updates.map(u => `
            <div class="update-item">
              <div class="update-date">${esc(fmtDate(u.created_at))}</div>
              <div class="update-body">${esc(u.body)}</div>
            </div>`).join('')}</div>`
        : `<p class="updates-empty">No updates posted yet — check back soon.</p>`;

      document.getElementById('app').innerHTML = `
        <div class="eyebrow">Project Dashboard · ${esc(project.client_name)}</div>
        <h1>${esc(project.name)}</h1>
        ${renderStepper(project.status)}
        ${project.staging_url ? `<div class="card"><h2>Staging Link</h2><a href="${esc(project.staging_url)}" class="staging-link" target="_blank" rel="noopener">View Current Build →</a></div>` : ''}
        <div class="card">
          <h2>Updates</h2>
          ${updatesHtml}
        </div>`;
    }

    async function load() {
      const token = new URLSearchParams(location.search).get('token');
      if (!token) { renderNotFound(); return; }
      try {
        const res = await fetch(`/api/project?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (!res.ok || !data.ok) { renderNotFound(); return; }
        renderProject(data.project, data.updates);
      } catch (_) {
        renderNotFound();
      }
    }
    load();

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const root = document.documentElement;
      const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('zw_theme', next); } catch (_) {}
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', next === 'light' ? '#ffffff' : '#0a0a0a');
    });
  </script>
</body>
</html>
